<!DOCTYPE html>
<html>
<head>
    <title>Title</title>
</head>
<body>
    <h1 id= "mainheading">Welcome to My Website</h1>
</body>

<script>
// Step 1: Create a new paragraph element
let newParagraph = document.createElement("p");

// Step 2: Add text content
newParagraph.textContent = "This is a dynamically created paragraph.";

// Step 3: Apply inline styles
newParagraph.style.color = "blue"; // Change text color
newParagraph.style.fontSize = "18px"; // Increase font size
newParagraph.style.fontWeight = "bold"; // Make text bold
newParagraph.style.padding = "10px"; // Add padding
newParagraph.style.backgroundColor = "#f0f0f0"; // Light gray background

// Step 4: Append the paragraph to the body
document.body.append(newParagraph);




</script>
</html>
