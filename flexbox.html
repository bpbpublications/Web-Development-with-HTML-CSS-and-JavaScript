<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Example</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .flex-container {
            display: flex;
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: space-between;
            align-items: center; 
            background-color: #e0e0e0;
            padding: 20px;

        }

        .flex-element {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 10px;
            border-radius: 5px;
            text-align: center;
            width: 150px;
        }


    </style>
</head>
<body>
    <div class="flex-container">
        <div class="flex-element">Element 1</div>
        <div class="flex-element">Element 2</div>
        <div class="flex-element">Element 3</div>

    </div>
</body>
</html>
