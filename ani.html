<!DOCTYPE html>
<html>
<head>
<style> 

    .box {
        width: 100px;
        height: 100px;
        border-radius: 5%; 
        position: relative;
        animation-name: example;
        animation-duration: 4s;
        animation-iteration-count: infinite;
    }

    @keyframes example {
       0% {
         background-color: red;
         left: 0px;
       }
       25% {
         background-color: orange;
         left: 100px;
       }
       50% {
         background-color: yellow;
         left: 200px;
       }
       75% {
         background-color: orange;
         left: 100px;
       }
       100% {
         background-color: red;
         left: 0px;
       }
    }

</style>
</head>
<body>
   <div class="box"></div>
</body>
</html>
